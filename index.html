<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환">🌙</button>
      <div class="avatar">홍</div>
      <h1>홍길동</h1>
      <p class="tagline">새로운 것을 배우고 만드는 걸 좋아하는 사람입니다.</p>
    </header>

    <section>
      <h2>소개</h2>
      <p>안녕하세요, 홍길동입니다. 문제를 발견하고 직접 해결책을 만들어 보는 과정을 즐깁니다.
        꾸준히 배우고, 배운 것을 나누는 사람이 되고자 합니다.</p>
    </section>

    <section>
      <h2>좋아하는 것 3가지</h2>
      <ul class="favorites">
        <li>
          <span class="emoji">📚</span>
          <strong>책 읽기</strong>
          <p>새로운 관점을 만나는 시간이 즐겁습니다.</p>
        </li>
        <li>
          <span class="emoji">🚶</span>
          <strong>산책</strong>
          <p>걸으면서 생각을 정리하는 걸 좋아합니다.</p>
        </li>
        <li>
          <span class="emoji">☕</span>
          <strong>커피</strong>
          <p>하루를 시작하는 작은 의식입니다.</p>
        </li>
      </ul>
    </section>

    <footer>© <span id="year"></span> 홍길동</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
